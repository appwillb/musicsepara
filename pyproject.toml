[project]
name = "vocal-remover-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "demucs>=4.0.1",
    "fastapi>=0.143.0",
    "numpy>=2.5.4",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "lameenc>=1.8.4",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
vocal-remover-app = "vocal_remover_app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
