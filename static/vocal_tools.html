  <body>
    <div id="app">
      <!-- Hidden navigation template for Vue router initialization -->

        </div>
      </main>
    </div>

    <!-- Floating Bridge Button: When an audio is ready/playing in any tool, send directly to tunemusic -->
    <button type="button" id="studio-prompter-bridge">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="6 3 20 12 6 21 6 3"/>
      </svg>
      <span>Abrir este Playback no tunemusic ➔</span>
    </button>

    <script>
      (function() {
        // 1. Listen for navigation commands from the Master Studio
        window.addEventListener('message', function(event) {
          const data = event.data;
          if (!data) return;

          if (data.type === 'navigate_tool') {
            const targetPath = data.path; // e.g. '/pt/pitch', '/pt/cutter'
            console.log('[VocalTools] Navigating to:', targetPath);
            const matchingLink = document.querySelector(`a[href*="${targetPath}"]`) || document.querySelector(`a[href="${targetPath}"]`);
            if (matchingLink) {
              matchingLink.click();
            } else {
              window.location.pathname = targetPath;
            }
          }
        });

        // 2. Detect audio players and show the bridge button
        const bridgeBtn = document.getElementById('studio-prompter-bridge');

        function checkAudioReady() {
          const playerWrap = document.querySelector('.player-encode, .page-player, .player, canvas');
          const audioEls = document.querySelectorAll('audio, source');
          let hasStem = false;
          let stemUrl = '';

          for (const a of audioEls) {
            const src = a.src || a.getAttribute('src');
            if (src && (src.includes('music') || src.includes('instrumental') || src.includes('listen') || src.includes('blob:'))) {
              hasStem = true;
              stemUrl = src;
              break;
            }
          }

          if (playerWrap && bridgeBtn) {
            bridgeBtn.style.display = 'flex';
            bridgeBtn.onclick = function() {
              const songTitle = document.querySelector('.player-title, .title, h1, h2')?.textContent || 'Música do Estúdio';
              // Notify parent Master Studio
              if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                  type: 'open_in_prompter',
                  audioUrl: stemUrl,
                  name: songTitle.trim()
                }, '*');
              }
            };
          }
        }

        const observer = new MutationObserver(checkAudioReady);
        observer.observe(document.body, { childList: true, subtree: true });
        setInterval(checkAudioReady, 1500);
      })();
    </script>
