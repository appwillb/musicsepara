version: '3.8'

services:
  vocalremover:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
      - data_storage:/app/data

volumes:
  uploads_data:
  outputs_data:
  data_storage:
